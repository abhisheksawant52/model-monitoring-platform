[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-monitoring-platform"
version = "0.1.0"
description = "FastAPI service for ML model monitoring: data drift, concept drift, performance, and alerting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = [
  "machine-learning",
  "model-monitoring",
  "data-drift",
  "concept-drift",
  "observability",
  "fastapi",
]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24.0",
  "pre-commit>=3.7",
]

[project.scripts]
model-monitoring = "model_monitoring.main:main"

[project.urls]
Homepage = "https://github.com/abhisheksawant52/model-monitoring-platform"
Issues = "https://github.com/abhisheksawant52/model-monitoring-platform/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
